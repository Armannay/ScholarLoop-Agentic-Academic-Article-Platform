[build-system]
requires = ["setuptools==80.9.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scholarloop"
version = "0.1.0"
description = "ScholarLoop - agentic academic article platform: deterministic orchestrator, planning-only LLM, token-frugal ledger."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "Proprietary" }
authors = [{ name = "ScholarLoop team" }]

# Pinned dependencies. Bumping a pin is a one-line change for the whole team.
dependencies = [
  "fastapi==0.143.1",
  "uvicorn[standard]==0.54.0",
  "pydantic==2.14.1",
  "pydantic-settings==2.16.0",
  "SQLAlchemy==2.1.4",
  "alembic==1.20.0",
  "httpx==0.28.1",
  "PyYAML==6.0.3",
  "cryptography==50.0.2",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "ruff==0.17.0",
  "mypy==2.4.0",
  "types-PyYAML==6.0.12.20260906",
]

[tool.setuptools]
package-dir = { "" = "backend" }

[tool.setuptools.packages.find]
where = ["backend"]
include = ["app*"]

# ---------------------------------------------------------------------------
# ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["backend", "backend/tests"]
extend-exclude = [".venv", "frontend", "docs/schemas"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF", "ASYNC", "S", "N", "PTH", "TID"]
ignore = [
  "S101",  # asserts are the point of the test-suite and of contract invariants
  "RUF001", "RUF002", "RUF003",  # ambiguous unicode in prose/docstrings is intentional
  "N818",  # domain errors read better without an 'Error' suffix (ProviderTimeout, BudgetExceeded)
]

[tool.ruff.lint.per-file-ignores]
"backend/tests/**" = ["S105", "S106", "S108"]
"backend/app/scripts/**" = ["T201"]  # the schema exporter is a CLI: printing is its job

[tool.ruff.lint.isort]
known-first-party = ["app"]

# ---------------------------------------------------------------------------
# mypy --strict
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
files = ["backend/app"]
mypy_path = "backend"
plugins = ["pydantic.mypy"]
warn_unreachable = true
show_error_codes = true
pretty = true
exclude = ["^backend/app/migrations/"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q --strict-markers --strict-config"
markers = [
  "contracts: contract round-trip and validation tests",
  "config: policy/rubric loader tests",
  "providers: provider interface and MockProvider tests",
  "api: FastAPI surface tests",
]
