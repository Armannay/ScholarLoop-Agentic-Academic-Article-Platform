openapi: 3.1.0

info:
  title: ScholarLoop UI API
  version: 1.0.0
  summary: Projects, runs, article, usage and errors for the ScholarLoop console.
  description: |
    The HTTP surface the ScholarLoop console is built against: **Projects**, **Runs**,
    **Article**, **Usage** and the single **Errors** envelope, plus the supporting
    `auth`, `health` and `config` calls every screen needs on boot.

    Conventions that hold for every operation below:

    * All payload schemas that are part of the wire format are **CONTRACTS v1**
      schemas and are referenced here by their contract name (`Brief`, `Plan`,
      `ChangeEntry`, `SectionState`, `LoopDecision`, `Verdict`, `QualityReport`,
      `SourceCard`). Their JSON Schema is `$ref`-ed straight from `docs/schemas/`,
      which `make schemas` exports from `backend/app/contracts/` — so this spec cannot
      drift from the Pydantic models without `make openapi-check` failing.
    * Every expected failure is the same envelope: `{"error": {code, message, context}}`.
      Clients switch on `error.code`, never on the message text.
    * Authentication is a bearer JWT (`Authorization: Bearer <token>`) from
      `POST /api/auth/login`. A missing, expired or foreign-owner resource is `401`
      or `404` — never `403`, so the API does not confirm that somebody else's id
      exists.
    * Anything under `/api/runs/{run_id}` is owner-scoped: another user's run reads
      as `404 run_not_found`.
    * Timestamps are timezone-aware UTC ISO-8601; ids are 26-character Crockford
      base32 ULIDs; `TokenUsage` is spelled `{"in": n, "out": n, "cached": n}`.
    * Request bodies and responses are `extra="forbid"` in production: an unknown
      field is an error, not a silently ignored typo.
  contact:
    name: ScholarLoop maintainers
    url: https://github.com/Armannay/ScholarLoop-Agentic-Academic-Article-Platform
  license:
    name: Proprietary - all rights reserved
    identifier: LicenseRef-Proprietary

servers:
  - url: http://localhost:8000
    description: Local API (`make run`), MockProvider only.
  - url: /
    description: Same origin as the console (Vite dev proxy / production reverse proxy).

security:
  - bearerAuth: []

x-scholarloop:
  contract-tag: contracts-v1.1
  contract-version: 1
  spec-version: 1.0.0
  status-vocabulary:
    implemented: The FastAPI router in `backend/app/api/` serves this operation today.
    planned: Designed here for the console; the backend port exists (article store,
      project derivation) but the route is not wired yet. Safe to generate a client
      against; do not call it against the current server.
  error-envelope: '#/components/schemas/ErrorEnvelope'
  sse-frame-format: "id: <seq>\nevent: <type>\ndata: <RunEvent JSON>\n\n"
  contract-schemas: docs/schemas/ (generated by `make schemas` from backend/app/contracts/)

tags:
  - name: projects
    description: |
      Projects group runs. CONTRACTS v1 has no Project table: a `project_id` is an
      owner-scoped opaque label stored on every run record, and a project's metadata
      is derived from its runs. The `projects` operations are therefore the console's
      view over run records (see `x-scholarloop-status` per operation).
  - name: runs
    description: |
      One run is one article attempt: intake, plan, iterations, checkpoints and the
      terminal `StopReport`. Runs execute in the background; the console polls
      `GET /api/runs/{run_id}` or tails `GET /api/runs/{run_id}/events` (SSE).
  - name: article
    description: |
      The article itself: the assembled markdown, per-section state, section version
      history, diffs, whole-article snapshots and rollback. Bodies are only sent by
      the operations that exist for a human to read them; everything else travels by
      reference (version, hash, word count).
  - name: usage
    description: |
      Token accounting per run, per role and per iteration, plus the caps those
      numbers are measured against.
  - name: errors
    description: |
      The single error envelope, the closed set of `code` values a client may switch
      on, and the two error conditions the console must render distinctly:
      `needs_user_input` (the loop cannot proceed) and `run_conflict` with
      `context.reason=active_run` (a second concurrent run was refused).
  - name: auth
    description: Register, log in, and identify the caller. Bearer JWT, no cookies.
  - name: health
    description: Liveness plus the two facts that decide whether a run may start.
  - name: config
    description: |
      Effective configuration and CONTRACTS v1 schema discovery, so the console can
      render the policies a run is obeying and validate payloads locally.
  - name: accounts
    description: Provider accounts (keys are write-only and never returned).
  - name: bindings
    description: Which accounts and model each agent role uses, resolved at call time.

paths:
  # ------------------------------------------------------------------ health
  /api/health:
    get:
      operationId: getHealth
      tags: [health]
      summary: Liveness and readiness
      description: |
        Cheap, secret-free, and the only operation that answers before config has
        loaded. `status=degraded` means a config file failed to load; `config_errors`
        names which one and why. The console disables "New run" while degraded.
      security: []
      x-scholarloop-status: implemented
      responses:
        '200':
          description: Service state, with or without loaded config.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              examples:
                ok:
                  $ref: './examples/health/health.response.200.ok.json'
                degraded:
                  $ref: './examples/health/health.response.200.degraded.json'

  /api/version:
    get:
      operationId: getVersion
      tags: [health]
      summary: Application, contract and environment identifiers
      description: |
        One cheap call for the footer and for support tickets: app version, CONTRACTS v1
        version and environment name. Never depends on config having loaded.
      security: []
      x-scholarloop-status: implemented
      responses:
        '200':
          description: Version identifiers in one call.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionResponse'
              examples:
                default:
                  $ref: './examples/health/version.response.200.json'

  # ------------------------------------------------------------------ config
  /api/config:
    get:
      operationId: getConfig
      tags: [config]
      summary: Effective configuration (policies after every override)
      description: |
        The numbers the loop is actually obeying, after code defaults, `policies.yaml`
        and any project override have been merged. `503 config_error` when startup
        could not load them: the console shows the reason instead of guessing defaults.
      x-scholarloop-status: implemented
      responses:
        '200':
          description: Merged policies plus the rubric summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigResponse'
              examples:
                default:
                  $ref: './examples/config/config.response.200.json'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/ConfigUnavailable'

  /api/contracts:
    get:
      operationId: listContracts
      tags: [config]
      summary: Names of every CONTRACTS v1 model
      description: |
        Discovery for `GET /api/contracts/{name}/schema`; mirrors the registry in
        `backend/app/contracts/registry.py`.
      x-scholarloop-status: implemented
      responses:
        '200':
          description: Contract names and the schema URL template.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractListResponse'
              examples:
                default:
                  $ref: './examples/config/contracts.response.200.json'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/contracts/{name}/schema:
    get:
      operationId: getContractSchema
      tags: [config]
      summary: JSON Schema (draft 2020-12) for one contract
      description: |
        Identical to the files in `docs/schemas/`: one source of truth for the wire
        format, usable by the console for client-side validation.
      x-scholarloop-status: implemented
      parameters:
        - name: name
          in: path
          required: true
          description: Contract name, e.g. `Brief` or `ChangeEntry`.
          schema:
            $ref: '#/components/schemas/ContractName'
      responses:
        '200':
          description: The contract's JSON Schema, with a stable `$id`.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                description: A JSON Schema document (draft 2020-12).
              examples:
                token_usage:
                  $ref: './examples/config/contract-schema.response.200.json'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # ------------------------------------------------------------------ auth
  /api/auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Create an account and receive a bearer token
      description: |
        Creates the user and returns a token in one round trip, so the console does not
        need a second call before it can create a project. Email is lower-cased and must
        be unique (`409` otherwise); the password is hashed with argon2 and never stored
        or logged in the clear.
      security: []
      x-scholarloop-status: implemented
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            examples:
              default:
                $ref: './examples/auth/register.request.json'
      responses:
        '201':
          description: The new user and its token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
              examples:
                default:
                  $ref: './examples/auth/register.response.201.json'
        '409':
          $ref: '#/components/responses/EmailTaken'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Exchange credentials for a token
      description: |
        Wrong email and wrong password answer identically (`401 auth_error`), so the
        operation cannot be used to enumerate accounts.
      security: []
      x-scholarloop-status: implemented
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            examples:
              default:
                $ref: './examples/auth/login.request.json'
      responses:
        '200':
          description: Bearer token plus the user it belongs to.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
              examples:
                default:
                  $ref: './examples/auth/login.response.200.json'
        '401':
          $ref: '#/components/responses/InvalidCredentials'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: The authenticated user
      description: |
        The caller behind the bearer token. The console calls this on boot to decide
        between the login screen and the project list.
      x-scholarloop-status: implemented
      responses:
        '200':
          description: The caller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserView'
              examples:
                default:
                  $ref: './examples/auth/me.response.200.json'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ------------------------------------------------------------------ projects
  /api/projects:
    get:
      operationId: listProjects
      tags: [projects]
      summary: List my projects
      description: |
        Projects are derived from the caller's run records, newest activity first: one
        entry per distinct `project_id` the owner has ever run. There is no Project
        table in CONTRACTS v1, so `run_count` and `latest_*` are computed, not stored.
      x-scholarloop-status: planned
      parameters:
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: The caller's projects.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectList'
              examples:
                default:
                  $ref: './examples/projects/list-projects.response.200.json'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: createProject
      tags: [projects]
      summary: Reserve a project label
      description: |
        A run creates its project implicitly, so this operation exists to give a
        project a display name and description *before* the first run - the console's
        "New project" dialog. Re-reserving the same label is `409 project_exists`.
      x-scholarloop-status: planned
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectCreate'
            examples:
              default:
                $ref: './examples/projects/create-project.request.json'
      responses:
        '201':
          description: The reserved project.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectView'
              examples:
                default:
                  $ref: './examples/projects/create-project.response.201.json'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/ProjectExists'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/projects/{project_id}:
    get:
      operationId: getProject
      tags: [projects]
      summary: One project
      description: |
        Project metadata plus its latest run, so the console's project header can render
        without a second call. `404 not_found` when the owner has neither reserved the
        label nor run anything under it.
      x-scholarloop-status: planned
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: Project metadata derived from its runs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectView'
              examples:
                default:
                  $ref: './examples/projects/get-project.response.200.json'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/projects/{project_id}/runs:
    get:
      operationId: listProjectRuns
      tags: [projects]
      summary: Runs of one project, newest first
      description: |
        The run history of a project. Summaries only: `RunView` omits plan, decisions
        and article bodies, and the list keeps that discipline so a project with two
        hundred runs still answers in one page.
      x-scholarloop-status: planned
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: The project's runs, newest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunList'
              examples:
                default:
                  $ref: './examples/runs/list-project-runs.response.200.json'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      # ------------------------------------------------------------------ runs
      operationId: createRun
      tags: [runs]
      summary: Create and start a run
      description: |
        Two shapes, exactly one per request:

        * `brief` - the full run. The `Brief` contract is validated by deterministic
          intake first, then the Planner runs. A brief that is missing something only
          the user can supply is `409 needs_user_input` with `context.missing_fields`
          naming each one - that is the console's "fill in the blanks" dialog, not a
          crash. A body that is structurally invalid (both kinds, neither kind, wrong
          types) is `422 validation_error`.
        * `quick_edit` - the cheap path. One section, one instruction, no Planner: the
          orchestrator builds exactly one `Task` for the requested role and executes it
          through the same scheduler, article store and ledger, so a quick edit is
          auditable exactly like planned work.

        With `wait=false` (default) the run is started in the background and the
        response is an `HTTP 202` snapshot of the run at creation. With `wait=true` the
        API runs inline until the next checkpoint or stop - the deterministic mode
        scripts and tests use.

        `409 run_conflict` with `context.reason=active_run` is refused while the same
        project already has a running run: one project, one live run, so a
        double-clicked button cannot start two agents on the same article.
      x-scholarloop-status: implemented
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunCreate'
            examples:
              brief:
                $ref: './examples/runs/create-run.request.json'
              quick_edit:
                $ref: './examples/runs/create-run.quick-edit.request.json'
      responses:
        '202':
          description: The run was created (and started, unless `wait=true`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunView'
              examples:
                accepted:
                  $ref: './examples/runs/create-run.response.202.json'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: |
            Two distinct user-facing conflicts share this status; branch on
            `error.code` first, then on `error.context.reason`:
            * `needs_user_input` - intake needs fields only the user can supply;
            * `run_conflict` with `context.reason=active_run` - the project already has
              a live run (the guard is part of this design; the current router starts a
              second run instead of refusing).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                needs_user_input:
                  $ref: './examples/errors/needs_user_input.409.json'
                active_run:
                  $ref: './examples/errors/active_run.409.json'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/runs/{run_id}:
    get:
      operationId: getRun
      tags: [runs]
      summary: Run state
      description: |
        The console's poll target: state, plan, decisions, Q series, the last
        `StopReport` and whether a background task is alive right now. Article bodies
        are **not** here - they live on `GET /api/runs/{run_id}/article`.
      x-scholarloop-status: implemented
      parameters:
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: The run as the API exposes it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunView'
              examples:
                in_progress:
                  $ref: './examples/runs/get-run.response.200.executing.json'
                checkpoint:
                  $ref: './examples/runs/get-run.response.200.checkpoint.json'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/RunNotFound'

  /api/runs/{run_id}/decision:
    post:
      operationId: answerRunDecision
      tags: [runs]
      summary: Answer a checkpoint or a stop
      description: |
        The user's one answer to whatever the loop is waiting for. `option` is one of
        `finish`, `continue`, `rollback`, `edit_goals`, `add_budget`,
        `continue_anyway`; which ones are currently legal is published in
        `run.stop_report.options` (and `run.stop_report.action` says why the loop
        paused), so the console renders buttons from the run, never from a guess.

        `add_budget` without `extra_tokens`/`extra_iterations`, or a `rollback` with no
        best snapshot, is `409 run_conflict`. At a `needs_input` checkpoint, the note
        the agent asked for goes in `note`; the orchestrator hands it to the Planner as
        user input and never splices it into article text itself.
      x-scholarloop-status: implemented
      parameters:
        - $ref: '#/components/parameters/RunId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserDecision'
            examples:
              finish:
                $ref: './examples/runs/decision.request.finish.json'
              add_budget:
                $ref: './examples/runs/decision.request.add-budget.json'
              needs_input_note:
                $ref: './examples/runs/decision.request.needs-input.json'
      responses:
        '200':
          description: The run after the decision (still running when `wait=false`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunView'
              examples:
                finished:
                  $ref: './examples/runs/decision.response.200.finished.json'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/RunNotFound'
        '409':
          description: |
            `run_conflict` when the option is illegal for the current state
            (`context.reason=invalid_transition`), or `needs_user_input` when the
            checkpoint cannot be answered without the information the agent asked for.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                invalid_transition:
                  $ref: './examples/errors/run_conflict.409.json'
                needs_user_input:
                  $ref: './examples/errors/needs_user_input.409.json'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/runs/{run_id}/stop:
    post:
      operationId: stopRun
      tags: [runs]
      summary: Stop a run
      description: |
        Always legal. An idle run is finalised immediately (`STOPPED_USER` with a
        `StopReport`); a run that is executing is *flagged* and stops at the end of the
        current wave, so no patch is torn in half. Poll the run (or the SSE stream) for
        the terminal state.
      x-scholarloop-status: implemented
      parameters:
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: The run, flagged or finalised.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunView'
              examples:
                stopped:
                  $ref: './examples/runs/stop.response.200.json'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/RunNotFound'

  /api/runs/{run_id}/events:
    get:
      operationId: streamRunEvents
      tags: [runs]
      summary: Run events (Server-Sent Events)
      description: |
        Replay of the persisted event log, then a live tail, in `seq` order. Each
        frame is exactly:

        ```
        id: <seq>
        event: <type>
        data: <RunEvent JSON>
        ```

        `after=<seq>` resumes a stream (send the last `id` you saw); `once=true`
        replays what exists and closes, which is what tests and `curl` use. The stream
        closes on its own when the run settles (`DONE` / `STOPPED_*` / `CHECKPOINT`).

        Known `event` types, all stable snake_case codes:
        `run_created`, `state_changed`, `iteration_started`, `plan_accepted`,
        `task_completed`, `task_failed`, `patch_rejected`, `source_card_rejected`,
        `section_update_rejected`, `planner_failed`, `planner_evaluated`,
        `loop_decision`, `checkpoint_reached`, `stop_requested`, `user_decision`,
        `rollback_applied`, `continue_once_used`, `validation_missing`,
        `run_completed`, `run_stopped`. Clients must ignore types they do not know.
      x-scholarloop-status: implemented
      x-sse-event-schema: '#/components/schemas/RunEvent'
      parameters:
        - $ref: '#/components/parameters/RunId'
        - name: after
          in: query
          required: false
          description: Resume after this `seq` (the last `id:` seen). `-1` = from the start.
          schema:
            type: integer
            default: -1
            minimum: -1
        - name: once
          in: query
          required: false
          description: Replay what exists and close instead of tailing.
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: |
            An SSE stream of `RunEvent` frames. The connection closes when the run
            settles or `once=true`.
          headers:
            Cache-Control:
              description: Always `no-cache`.
              schema:
                type: string
                const: no-cache
            X-Accel-Buffering:
              description: Always `no`, so a reverse proxy does not buffer the stream.
              schema:
                type: string
                const: 'no'
          content:
            text/event-stream:
              schema:
                type: string
                description: |
                  Consecutive frames, each `id: <seq>` + `event: <type>` +
                  `data: <RunEvent JSON>`, separated by a blank line. See
                  `#/components/schemas/RunEvent` for the payload.
              examples:
                run_created:
                  $ref: './examples/runs/events.run-created.sse.yaml'
                state_changed:
                  $ref: './examples/runs/events.state-changed.sse.yaml'
                task_completed:
                  $ref: './examples/runs/events.task-completed.sse.yaml'
                checkpoint_reached:
                  $ref: './examples/runs/events.checkpoint-reached.sse.yaml'
                loop_decision:
                  $ref: './examples/runs/events.loop-decision.sse.yaml'
                run_stopped:
                  $ref: './examples/runs/events.run-stopped.sse.yaml'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/RunNotFound'

  /api/runs/{run_id}/events/history:
    get:
      operationId: getRunEventHistory
      tags: [runs]
      summary: Run events as JSON (the SSE log, without the stream)
      description: |
        The same persisted events the SSE stream carries, as a pageable JSON array.
        The console uses it to rebuild the activity timeline after a reconnect (SSE
        replays from `after`, but a browser that was closed has no `after`) and for
        tests that cannot consume a stream.

        Events are returned in `seq` order. `next_after` is the cursor to pass as
        `after` on the next call, or `null` when the log is exhausted.
      x-scholarloop-status: planned
      parameters:
        - $ref: '#/components/parameters/RunId'
        - name: after
          in: query
          required: false
          description: Only events with `seq > after`.
          schema:
            type: integer
            default: -1
            minimum: -1
        - name: limit
          in: query
          required: false
          description: Maximum events to return (default 200, max 1000).
          schema:
            type: integer
            default: 200
            minimum: 1
            maximum: 1000
      responses:
        '200':
          description: A page of run events.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunEventList'
              examples:
                default:
                  $ref: './examples/runs/events-history.response.200.json'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/RunNotFound'

  /api/runs/{run_id}/digest:
    get:
      operationId: getRunDigest
      tags: [runs]
      summary: The bounded digest the Planner reads
      description: |
        The compacted `claude.md` the Planner is fed: recent decisions, open issues and
        the numbers that matter, capped at `max_tokens`. `compacted=true` means the
        compactor rewrote it this iteration; the console shows the digest verbatim so a
        reviewer can see *exactly* what the agents were told.
      x-scholarloop-status: implemented
      parameters:
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: The digest plus its budget.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DigestView'
              examples:
                default:
                  $ref: './examples/runs/digest.response.200.json'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/RunNotFound'

  /api/runs/{run_id}/ledger:
    get:
      operationId: getRunLedger
      tags: [runs]
      summary: The append-only change ledger
      description: |
        Every change attempt, in order: which task, which role, which section, whether
        it applied, what it cost in tokens, and which issues it opened or closed. This
        is the audit trail the console's "what changed" panel renders.
      x-scholarloop-status: implemented
      parameters:
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: The ledger entries, oldest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LedgerView'
              examples:
                default:
                  $ref: './examples/runs/ledger.response.200.json'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/RunNotFound'

  /api/runs/{run_id}/quality:
    get:
      operationId: getRunQuality
      tags: [runs]
      summary: Quality reports (gates, criteria scores, Q)
      description: |
        The last `QualityReport` plus the Q series, so the console can render the 8 hard
        gates, the 9 weighted criteria and the trend without re-deriving them. `latest`
        is `null` until the first validation pass has completed.

        Why a separate operation: `RunView` carries only `q_series`/`best_q`, never the
        per-gate detail. Reading 8 booleans + 9 scores on every poll of a running run
        would cost more than the console needs.
      x-scholarloop-status: planned
      parameters:
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: The latest report and the Q history.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QualityView'
              examples:
                default:
                  $ref: './examples/runs/quality.response.200.json'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/RunNotFound'

  # ------------------------------------------------------------------ article
  /api/runs/{run_id}/article:
    get:
      operationId: getRunArticle
      tags: [article]
      summary: Assembled article (markdown, sections, sources)
      description: |
        The whole article in one response: the assembled `markdown`, `body_words`, the
        per-section states with their text, and every source card the run collected.

        This is the only operation that returns article bodies in bulk. Everything else
        (run, ledger, history, snapshots) travels by reference - version, hash, word
        count - so a poll of a 40-page article stays small.
      x-scholarloop-status: implemented
      parameters:
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: The assembled article.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArticleView'
              examples:
                default:
                  $ref: './examples/article/article.response.200.json'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/RunNotFound'

  /api/runs/{run_id}/article/sections/{section_id}/history:
    get:
      operationId: getSectionHistory
      tags: [article]
      summary: Version history of one section
      description: |
        Every immutable version of a section, oldest first: version number, content
        hash, word count, status, the patch that produced it, how many characters it
        added/removed, and the Q measured while it was head. Bodies are not included -
        fetch the version diff or the article for text.
      x-scholarloop-status: planned
      parameters:
        - $ref: '#/components/parameters/RunId'
        - $ref: '#/components/parameters/SectionId'
      responses:
        '200':
          description: The section's versions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SectionHistoryView'
              examples:
                default:
                  $ref: './examples/article/section-history.response.200.json'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/runs/{run_id}/article/sections/{section_id}/diff:
    get:
      operationId: getSectionDiff
      tags: [article]
      summary: Diff between two versions of one section
      description: |
        Character/line statistics plus a unified diff between two historical versions.
        `from` defaults to the previous version and `to` to the head, so the console's
        "what changed last" view needs no parameters at all.
      x-scholarloop-status: planned
      parameters:
        - $ref: '#/components/parameters/RunId'
        - $ref: '#/components/parameters/SectionId'
        - name: from
          in: query
          required: false
          description: Base version (defaults to `to - 1`, or 0 for the first text).
          schema:
            type: integer
            minimum: 0
        - name: to
          in: query
          required: false
          description: Target version (defaults to the current head).
          schema:
            type: integer
            minimum: 0
      responses:
        '200':
          description: The rendered diff.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SectionDiffView'
              examples:
                default:
                  $ref: './examples/article/section-diff.response.200.json'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/runs/{run_id}/article/snapshots:
    get:
      operationId: listArticleSnapshots
      tags: [article]
      summary: Whole-article snapshots
      description: |
        Every snapshot the orchestrator took (one per iteration that produced a
        measurable article), newest first, plus which one is currently the best. A
        snapshot is the rollback target: `best_snapshot_id` on the run and the
        `rollback` stop option both point at one of these ids.
      x-scholarloop-status: planned
      parameters:
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: Snapshot metadata, newest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SnapshotList'
              examples:
                default:
                  $ref: './examples/article/snapshots.response.200.json'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/RunNotFound'

  /api/runs/{run_id}/article/restore:
    post:
      operationId: restoreArticleSnapshot
      tags: [article]
      summary: Roll the article back to a snapshot
      description: |
        Restores every section from a snapshot as a **new** version (history is
        append-only; nothing is rewritten). The same effect is reachable through
        `POST /api/runs/{run_id}/decision` with `option=rollback`, which always targets
        the best snapshot; this operation exists so the console can offer "go back to
        iteration 2" for any snapshot it lists.

        `dry_run=true` reports what would change without writing. A snapshot id that
        does not belong to the run is `404 not_found`; restoring while a task is
        executing is `409 run_conflict`.
      x-scholarloop-status: planned
      parameters:
        - $ref: '#/components/parameters/RunId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RestoreRequest'
            examples:
              default:
                $ref: './examples/article/restore.request.json'
      responses:
        '200':
          description: What the restore changed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestoreView'
              examples:
                default:
                  $ref: './examples/article/restore.response.200.json'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'

  # ------------------------------------------------------------------ usage
  /api/runs/{run_id}/usage:
    get:
      operationId: getRunUsage
      tags: [usage]
      summary: Token usage for a run
      description: |
        Where the tokens went: total, agents vs planner, per role, per iteration, and
        the caps those numbers are measured against (`token_cap` already includes any
        `add_budget` grants, `max_iterations` any extra iterations). The console draws
        the budget bar from `total / token_cap` and the per-role split from `by_role`.
      x-scholarloop-status: implemented
      parameters:
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: Usage breakdown and caps.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunUsageView'
              examples:
                default:
                  $ref: './examples/usage/usage.response.200.json'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/RunNotFound'

  # ------------------------------------------------------------------ errors
  /api/errors/catalog:
    get:
      operationId: listErrorCatalog
      tags: [errors]
      summary: The closed set of error codes
      description: |
        Every `error.code` a client may receive, with its HTTP status, whether retrying
        the identical call can help, and the `context` keys that come with it. The
        console uses it to localize messages and to decide when to offer "try again".

        The catalog is authoritative for *this* contract version: an unknown code in a
        response means the server is newer than the client, which is exactly the signal
        a mismatch banner needs.
      x-scholarloop-status: planned
      responses:
        '200':
          description: The catalog, sorted by code.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorCatalog'
              examples:
                default:
                  $ref: './examples/errors/catalog.response.200.json'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ------------------------------------------------------------------ accounts
  /api/accounts:
    get:
      operationId: listAccounts
      tags: [accounts]
      summary: List my provider accounts
      description: |
        The caller's accounts. Key material never appears: `key_fingerprint` (12 hex
        characters) identifies a key across rotations, `key_mask` (`****` + last 4) is
        safe to display.
      x-scholarloop-status: implemented
      responses:
        '200':
          description: The caller's accounts.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AccountView'
              examples:
                default:
                  $ref: './examples/accounts/list-accounts.response.200.json'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: createAccount
      tags: [accounts]
      summary: Add a provider account
      description: |
        `api_key` is write-only: it is encrypted with the master key and never returned,
        logged or echoed - not even in a validation error (the handler redacts it to
        `invalid api_key`). `provider=openai_compatible` requires `base_url`; every other
        provider rejects it.
      x-scholarloop-status: implemented
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountCreate'
            examples:
              default:
                $ref: './examples/accounts/create-account.request.json'
      responses:
        '201':
          description: The stored account, without the key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountView'
              examples:
                default:
                  $ref: './examples/accounts/create-account.response.201.json'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
        '503':
          $ref: '#/components/responses/ConfigUnavailable'

  /api/accounts/{account_id}:
    get:
      operationId: getAccount
      tags: [accounts]
      summary: One account (no key material)
      description: Another owner's account reads as `404 not_found`, exactly like a missing one.
      x-scholarloop-status: implemented
      parameters:
        - $ref: '#/components/parameters/AccountId'
      responses:
        '200':
          description: The account view.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountView'
              examples:
                default:
                  $ref: './examples/accounts/get-account.response.200.json'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: patchAccount
      tags: [accounts]
      summary: Rotate the key, relabel, move base_url, reset budget or status
      description: |
        Every field is optional. Absent means "leave it alone"; an explicit `null`
        clears `base_url` or the budget. `api_key` may not be `null` (omit it to keep
        the current key) - sending `null` is `422 contract_violation`.
      x-scholarloop-status: implemented
      parameters:
        - $ref: '#/components/parameters/AccountId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountPatch'
            examples:
              default:
                $ref: './examples/accounts/patch-account.request.json'
      responses:
        '200':
          description: The updated account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountView'
              examples:
                default:
                  $ref: './examples/accounts/patch-account.response.200.json'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      operationId: deleteAccount
      tags: [accounts]
      summary: Delete an account (protected against orphaning enabled roles)
      description: |
        Refused (`409 conflict`) while the account is the only candidate of an enabled
        role binding, unless a `replacement_account_id` is given or `disable_roles=true`
        is passed - the delete cascades explicitly, never silently. The response says
        exactly which roles were disabled, which bindings got the replacement, and which
        lost the account.
      x-scholarloop-status: implemented
      parameters:
        - $ref: '#/components/parameters/AccountId'
        - name: replacement_account_id
          in: query
          required: false
          description: Another account to substitute in every binding that referenced this one.
          schema:
            $ref: '#/components/schemas/Ulid'
        - name: disable_roles
          in: query
          required: false
          description: Disable the bindings that would otherwise be orphaned.
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: What the delete did.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteResult'
              examples:
                default:
                  $ref: './examples/accounts/delete-account.response.200.json'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/accounts/{account_id}/test:
    post:
      operationId: testAccount
      tags: [accounts]
      summary: Probe the credential with one tiny call
      description: |
        Makes the smallest possible provider call and reports reachability, model and
        latency. A rejected key is `200 ok=false` with `error_code` - the probe itself
        succeeded, the credential did not. No key material is echoed.
      x-scholarloop-status: implemented
      parameters:
        - $ref: '#/components/parameters/AccountId'
      responses:
        '200':
          description: Probe result (success or a provider rejection).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountTestResult'
              examples:
                ok:
                  $ref: './examples/accounts/test-account.response.200.ok.json'
                auth_failed:
                  $ref: './examples/accounts/test-account.response.200.auth-failed.json'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ConfigUnavailable'

  # ------------------------------------------------------------------ bindings
  /api/agents/{role}/binding:
    get:
      operationId: getAgentBinding
      tags: [bindings]
      summary: Binding for one agent role
      description: |
        Which accounts and model a role resolves at call time. No binding exists until
        the user creates one: the orchestrator then falls back to the mock provider, and
        a run that needs a real account fails with `no_account_available` rather than
        inventing a configuration.
      x-scholarloop-status: implemented
      parameters:
        - $ref: '#/components/parameters/BindingRole'
      responses:
        '200':
          description: The binding.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BindingView'
              examples:
                default:
                  $ref: './examples/bindings/get-binding.response.200.json'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/BindingNotFound'
    put:
      operationId: putAgentBinding
      tags: [bindings]
      summary: Create or replace a binding
      description: |
        Creates or replaces the role's binding. `account_ids` is ordered: `dedicated`
        uses the first, `failover` walks the list, `round_robin` rotates. Token limits
        are per call, not per run.
      x-scholarloop-status: implemented
      parameters:
        - $ref: '#/components/parameters/BindingRole'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BindingPut'
            examples:
              default:
                $ref: './examples/bindings/put-binding.request.json'
      responses:
        '200':
          description: The stored binding.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BindingView'
              examples:
                default:
                  $ref: './examples/bindings/put-binding.response.200.json'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

# ============================================================================ components
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        `Authorization: Bearer <access_token>` from `POST /api/auth/login` (or
        `/api/auth/register`). Sent as a header, never as a cookie, so a console page
        and a script use the same credential.

  # ---------------------------------------------------------------- parameters
  parameters:
    Limit:
      name: limit
      in: query
      required: false
      description: Maximum items to return.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    ProjectId:
      name: project_id
      in: path
      required: true
      description: |
        Opaque, owner-scoped project label. `[a-z0-9][a-z0-9-]{2,63}` - a slug the user
        chooses, not a ULID: it is stable across runs and readable in a URL.
      schema:
        type: string
        pattern: '^[a-z0-9][a-z0-9-]{2,63}$'
        examples: [peer-review-2026]
    RunId:
      name: run_id
      in: path
      required: true
      description: Run ULID.
      schema:
        $ref: '#/components/schemas/Ulid'
    SectionId:
      name: section_id
      in: path
      required: true
      description: Section id as it appears in `SectionState.id`.
      schema:
        $ref: '#/components/schemas/SectionId'
    AccountId:
      name: account_id
      in: path
      required: true
      description: Provider account ULID.
      schema:
        $ref: '#/components/schemas/Ulid'
    BindingRole:
      name: role
      in: path
      required: true
      description: The role whose binding is addressed (the planner and compactor included).
      schema:
        $ref: '#/components/schemas/BindingRole'

  # ---------------------------------------------------------------- responses
  responses:
    Unauthorized:
      description: Missing, malformed, expired or unknown bearer token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            default:
              $ref: './examples/errors/unauthorized.401.json'
    InvalidCredentials:
      description: |
        Wrong email or wrong password - deliberately indistinguishable, so the operation
        cannot be used to enumerate accounts.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            default:
              $ref: './examples/errors/invalid_credentials.401.json'
    NotFound:
      description: No such object, or it belongs to somebody else.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            default:
              $ref: './examples/errors/not_found.404.json'
    RunNotFound:
      description: |
        No such run for this owner. Never 403 - the API does not confirm a foreign id
        exists.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            default:
              $ref: './examples/errors/run_not_found.404.json'
    Conflict:
      description: |
        Well-formed request, current state refuses it: `409 conflict` (or a subclass
        such as `run_conflict`/`invalid_transition`) with `context.reason` naming the
        condition.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            default:
              $ref: './examples/errors/conflict.409.json'
    EmailTaken:
      description: |
        The email is already registered. The wire code is `conflict` with
        `context.reason=email_taken`; the message never confirms whether the address
        exists beyond this endpoint's own 409.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            default:
              $ref: './examples/errors/email_taken.409.json'
    ProjectExists:
      description: |
        The project label is already reserved by this owner (`conflict` with
        `context.reason=project_exists`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            default:
              $ref: './examples/errors/project_exists.409.json'
    ValidationError:
      description: |
        The request body failed validation. Field locations and messages are reported;
        the submitted value is never echoed back, so a bad `api_key` cannot leak into a
        response or a log line.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationErrorEnvelope'
          examples:
            default:
              $ref: './examples/errors/validation_error.422.json'
    ConfigUnavailable:
      description: |
        A configuration file or the master key is missing, so the operation cannot run.
        `/api/health` says which one.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            default:
              $ref: './examples/errors/config_unavailable.503.json'
    BindingNotFound:
      description: |
        No binding exists for this role yet. **Shape caveat:** the current router raises
        a FastAPI `HTTPException`, so this response is `{"detail": {"code", "message"}}`
        rather than the standard envelope. The console handles both; see
        `CONTRACT-CHANGE-REQUESTS` in the handoff.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/HttpExceptionEnvelope'
          examples:
            default:
              $ref: './examples/errors/binding_not_found.404.json'

  # ---------------------------------------------------------------- schemas
  schemas:
    # ---- primitives ----------------------------------------------------
    Ulid:
      type: string
      description: 26-character Crockford base32 ULID (48-bit time + 80-bit randomness).
      pattern: '^[0-7][0-9A-HJKMNP-TV-Z]{25}$'
      examples: [01M5Z0X96Y46B0GTT36PSYZBQA]
    SectionId:
      type: string
      description: Stable section id; used in URLs and as the article's ordering key.
      pattern: '^[a-z0-9][a-z0-9._-]{0,63}$'
      examples: [method]
    Hash:
      type: string
      description: SHA-256 of a section body, prefixed `sha256:`.
      pattern: '^sha256:[0-9a-f]{64}$'
    TokenCount:
      type: integer
      minimum: 0
      description: A token count. Never negative, never a float.
    Version:
      type: integer
      minimum: 0
      description: Monotonic version number of one section.

    # ---- closed vocabularies -------------------------------------------
    RunStateName:
      type: string
      description: |
        The twelve run states. `CHECKPOINT` is the single "waiting for the user" state;
        `STOPPED_*` are resumable (the user may add budget or continue), `DONE` is not.
      enum:
        [INTAKE, PLANNING, EXECUTING, VALIDATING, DECIDING, CHECKPOINT, REPLANNING, DONE,
         STOPPED_EROSION, STOPPED_BUDGET, STOPPED_ERRORS, STOPPED_USER]
    CheckpointKind:
      type: string
      description: Why the run is paused in `CHECKPOINT`.
      enum: [completion, needs_input, evaluation_failed]
    RunKind:
      type: string
      description: >-
        `brief` is the full planner run; `quick_edit` is the planner-free single-section edit.
      enum: [brief, quick_edit]
    StopOption:
      type: string
      description: |
        What the user may choose at a checkpoint or after a stop. The legal subset is
        published per run in `run.stop_report.options`.
      enum: [finish, continue, rollback, edit_goals, add_budget, continue_anyway]
    LoopActionName:
      type: string
      description: Mirrors `contracts.enums.LoopAction` - why the loop paused or stopped.
      enum: [CONTINUE, OFFER_FINISH, ASK_USER, STOP_EROSION, STOP_BUDGET, STOP_ERRORS, STOP_USER]
    OnComplete:
      type: string
      description: |
        What happens at a completion candidate: `ask` pauses in `CHECKPOINT`,
        `finish` stops immediately, `continue_once` runs one more iteration then asks.
      enum: [ask, finish, continue_once]
      default: ask
    BindingRole:
      type: string
      description: The five agents plus the planner and the compactor - every role that resolves an account.
      enum: [planner, architect, researcher, writer, reviewer, validator, compactor]
    BindingStrategy:
      type: string
      description: |
        How a binding picks among its `account_ids`: `dedicated` always the first,
        `failover` walks the list on error, `round_robin` rotates per call.
      enum: [dedicated, round_robin, failover]
      default: failover
    AccountProvider:
      type: string
      description: Only `mock` is implemented today; the other two are accepted and probed.
      enum: [anthropic, openai_compatible, mock]
    AccountStatus:
      type: string
      description: Resolved at call time, never cached in a binding.
      enum: [active, degraded, disabled]
    ContractName:
      type: string
      description: A CONTRACTS v1 model name, as exported to `docs/schemas/`.
      enum:
        - Account
        - AccountPublic
        - AgentBinding
        - AgentResult
        - Brief
        - ChangeEntry
        - CitationRef
        - LLMMessage
        - LLMRequest
        - LLMResponse
        - LoopDecision
        - MonthlyBudget
        - Patch
        - PatchOp
        - Plan
        - QualityIssue
        - QualityReport
        - SectionState
        - SourceCard
        - SystemBlock
        - Task
        - TokenUsage
        - Verdict
    ErrorCode:
      type: string
      description: |
        The closed set of `error.code` values (the `errors` catalog endpoint publishes
        the same list with statuses and retry hints). Clients switch on these; the
        message text is for humans and may change.
      enum:
        - auth_error
        - not_found
        - run_not_found
        - conflict
        - run_conflict
        - invalid_transition
        - needs_user_input
        - no_account_available
        - budget_exceeded
        - contract_violation
        - validation_error
        - config_error
        - policy_error
        - rubric_error
        - provider_error
        - provider_auth_error
        - provider_rate_limited
        - provider_quota_exceeded
        - provider_timeout
        - provider_unavailable
        - provider_bad_response
        - provider_unsupported
        - orchestrator_error
        - scholarloop_error

    # ---- health / config -----------------------------------------------
    ProviderStatus:
      type: object
      description: >
        Which providers are usable right now. No keys, ciphertexts or fingerprints -
        a health endpoint must be safe to expose to a load balancer and to paste into
        a ticket.
      additionalProperties: false
      required: [mock, live_adapters_implemented, accounts_configured, live_providers_enabled, account_store_ready]
      properties:
        mock:
          type: boolean
          description: The deterministic MockProvider is always available.
        live_adapters_implemented:
          type: array
          items:
            type: string
          description: Provider names with an implemented adapter (empty in this step).
        accounts_configured:
          type: integer
          minimum: 0
          description: How many accounts the store holds, across all users.
        live_providers_enabled:
          type: boolean
          description: True when the master key is loaded and live calls are possible.
        account_store_ready:
          type: boolean
          description: False when APP_MASTER_KEY is missing - the store is sealed.

    HealthResponse:
      type: object
      description: >
        Liveness plus the two facts that decide whether a run may start. Always
        answers, even when a config file failed to load.
      additionalProperties: false
      required: [status, version, contract_version, env, policies_loaded, rubric_loaded, providers, config_errors]
      properties:
        status:
          type: string
          enum: [ok, degraded]
          description: degraded when a config file failed to load; the console disables new runs.
        version:
          type: string
          examples: [0.9.0]
        contract_version:
          type: integer
          const: 1
        env:
          type: string
          examples: [local]
        policies_loaded:
          type: boolean
        rubric_loaded:
          type: boolean
        providers:
          $ref: '#/components/schemas/ProviderStatus'
        config_errors:
          type: object
          description: File name -> why it failed. Empty when everything loaded.
          additionalProperties:
            type: string

    VersionResponse:
      type: object
      description: One cheap call for the footer and for support tickets.
      additionalProperties: false
      required: [app_version, contract_version, env, provider_default]
      properties:
        app_version:
          type: string
          examples: [0.9.0]
        contract_version:
          type: integer
          const: 1
        env:
          type: string
          examples: [local]
        provider_default:
          type: string
          examples: [mock]

    RubricSummary:
      type: object
      description: The rubric as the dashboard needs it - sections, gates and weights.
      additionalProperties: false
      required: [article_types, gates, criteria_weights, weights_total, abstract_word_range]
      properties:
        article_types:
          type: object
          description: Article type -> the section ids that must exist for it.
          additionalProperties:
            type: array
            items:
              $ref: '#/components/schemas/SectionId'
        gates:
          type: array
          description: The 8 hard gates, in canonical order.
          items:
            type: string
          minItems: 8
          maxItems: 8
        criteria_weights:
          type: object
          description: The 9 soft criteria -> weight (they sum to weights_total).
          additionalProperties:
            type: number
        weights_total:
          type: number
          examples: [100.0]
        abstract_word_range:
          type: object
          additionalProperties: false
          required: [min, max]
          properties:
            min:
              type: integer
            max:
              type: integer

    ConfigResponse:
      type: object
      description: Effective configuration after code defaults, policies.yaml and overrides are merged.
      additionalProperties: false
      required: [contract_version, policies_path, policies, rubric]
      properties:
        contract_version:
          type: integer
          const: 1
        policies_path:
          type: string
          examples: [config/policies.yaml]
        overrides_path:

          type: [string, 'null']
        project:

          type: [string, 'null']
        policies:
          type: object
          description: Deep-merged, validated policy values (caps, tolerances, thresholds).
          additionalProperties: true
        rubric:
          $ref: '#/components/schemas/RubricSummary'

    ContractListResponse:
      type: object
      description: The contract registry, so clients can discover the schema endpoints.
      additionalProperties: false
      required: [contract_version, names, schema_url_template]
      properties:
        contract_version:
          type: integer
          const: 1
        names:
          type: array
          items:
            $ref: '#/components/schemas/ContractName'
        schema_url_template:
          type: string
          description: URL template with a `{name}` placeholder.
          examples: ['/api/contracts/{name}/schema']

    # ---- auth ------------------------------------------------------------
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      description: >
        Creates the user. The email is trimmed and lower-cased; the password is hashed
        with argon2 and never returned.
      properties:
        email:
          type: string
          format: email
          minLength: 3
          maxLength: 255
        password:
          type: string
          format: password
          minLength: 10
          maxLength: 256
          description: At least 10 characters (MIN_PASSWORD_LENGTH).

    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password

    UserView:
      type: object
      description: The user as the API exposes it. There is no password field here at all.
      additionalProperties: false
      required: [id, email, created_at]
      properties:
        id:
          $ref: '#/components/schemas/Ulid'
        email:
          type: string
          format: email
        created_at:
          type: string
          format: date-time

    TokenResponse:
      type: object
      description: Bearer token plus the user it belongs to.
      additionalProperties: false
      required: [access_token, token_type, user]
      properties:
        access_token:
          type: string
          description: "JWT. Send as `Authorization: Bearer <access_token>`."
        token_type:
          type: string
          const: bearer
        user:
          $ref: '#/components/schemas/UserView'

    # ---- projects --------------------------------------------------------
    ProjectCreate:
      type: object
      description: Reserve a project label before the first run.
      additionalProperties: false
      required: [id, name]
      properties:
        id:
          type: string
          pattern: '^[a-z0-9][a-z0-9-]{2,63}$'
          description: The label used in every run URL. Immutable once reserved.
          examples: [peer-review-2026]
        name:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: [string, 'null']
          maxLength: 600

    ProjectView:
      type: object
      description: >
        Project metadata. Everything except the label and display name is derived from
        the project's runs - CONTRACTS v1 has no Project table.
      additionalProperties: false
      required: [id, name, run_count, created_at, updated_at]
      properties:
        id:
          type: string
          pattern: '^[a-z0-9][a-z0-9-]{2,63}$'
        name:
          type: string
        description:

          type: [string, 'null']
        run_count:
          type: integer
          minimum: 0
        latest_run_id:

          anyOf:

            - $ref: '#/components/schemas/Ulid'

            - type: 'null'
        latest_state:

          anyOf:

            - $ref: '#/components/schemas/RunStateName'

            - type: 'null'
        latest_q:

          type: [number, 'null']
        best_q:

          type: [number, 'null']
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ProjectList:
      type: object
      additionalProperties: false
      required: [projects, total]
      properties:
        projects:
          type: array
          items:
            $ref: '#/components/schemas/ProjectView'
        total:
          type: integer
          minimum: 0

    # ---- runs ------------------------------------------------------------
    QuickEditRequest:
      type: object
      description: >
        One direct edit to one section, executed without the Planner. It still becomes a
        real Task, applied through the article store and written to the ledger, so a
        quick edit is auditable exactly like planned work.
      additionalProperties: false
      required: [section_id, instructions]
      properties:
        section_id:
          $ref: '#/components/schemas/SectionId'
        instructions:
          type: string
          minLength: 1
          maxLength: 2400
        role:
          type: string
          description: Which agent executes the edit.
          enum: [architect, researcher, writer, reviewer, validator]
          default: writer
        acceptance:
          type: array
          maxItems: 8
          items:
            type: string
            minLength: 1
          default:
            - Edit applied exactly as instructed
            - No new unsupported claims, sources or quotes introduced
        token_budget:
          type: integer
          minimum: 1
          maximum: 2000000
          default: 4000

    RunCreate:
      type: object
      description: >
        Exactly one of `brief` / `quick_edit`. `brief` is a raw CONTRACTS v1 Brief
        object: intake validates it deterministically and names every missing field
        instead of inventing a default.

        Every field except the `brief`/`quick_edit` pair is optional: `on_complete`
        defaults to `ask` (never finish silently) and `wait` to `false`.
      additionalProperties: false
      oneOf:
        - required: [brief]
        - required: [quick_edit]
      properties:
        brief:
          allOf:
            - $ref: '#/components/schemas/Brief'
          description: The full run. Exactly one of brief/quick_edit per request.
        quick_edit:
          $ref: '#/components/schemas/QuickEditRequest'
        on_complete:
          $ref: '#/components/schemas/OnComplete'
        max_wall_seconds:
          type: number
          exclusiveMinimum: 0
          maximum: 604800
          description: Wall-clock ceiling for the run (default comes from policies).
        wait:
          type: boolean
          default: false
          description: Run inline to the next checkpoint/stop instead of returning a 202 immediately.

    StopReport:
      type: object
      description: >
        Why the loop stopped, with the numbers and the options the user may pick. Every
        terminal state and every checkpoint carries one; the console renders its buttons
        from `options` and never from a hard-coded list.
      additionalProperties: false
      required: [schema_version, run_id, action, reasons, created_at]
      properties:
        schema_version:
          type: integer
          const: 1
        run_id:
          $ref: '#/components/schemas/Ulid'
        action:
          $ref: '#/components/schemas/LoopActionName'
        reasons:
          type: array
          minItems: 1
          maxItems: 20
          items:
            type: string
            minLength: 1
          description: Stable snake_case reason codes, most important first.
        evidence:
          type: object
          additionalProperties: true
          description: The numbers behind the decision (deltas, plateaus, budgets).
        q_series:
          type: array
          items:
            type: integer
            minimum: 0
            maximum: 100
        current_q:
          type: [integer, 'null']
          minimum: 0
          maximum: 100
        best_q:
          type: [number, 'null']
        best_iter:
          type: [integer, 'null']
          minimum: 0
        best_snapshot_id:
          type: [string, 'null']
          description: The rollback target, when a snapshot exists.
        iterations:
          type: integer
          minimum: 0
        tokens_spent:
          $ref: '#/components/schemas/TokenCount'
        verdict:
          anyOf:
            - $ref: '#/components/schemas/Verdict'
            - type: 'null'
        options:
          type: array
          items:
            $ref: '#/components/schemas/StopOption'
          description: The legal answers for this exact state. May be empty mid-machine.
        created_at:
          type: string
          format: date-time

    RunView:
      type: object
      description: >
        A run as the API exposes it. Article bodies are deliberately absent: the console
        polls this every second while a run is live, so it carries state and references
        (ids, hashes, counts) only.
      additionalProperties: false
      required:
        [id, project_id, kind, state, iter, decisions, q_series, on_complete,
         user_stop_requested, running, tokens_spent, created_at, updated_at]
      properties:
        id:
          $ref: '#/components/schemas/Ulid'
        project_id:
          type: string
          pattern: '^[a-z0-9][a-z0-9-]{2,63}$'
        owner_id:
          type: [string, 'null']
        kind:
          $ref: '#/components/schemas/RunKind'
        state:
          $ref: '#/components/schemas/RunStateName'
        iter:
          type: integer
          minimum: 0
        brief:
          anyOf:
            - $ref: '#/components/schemas/Brief'
            - type: 'null'
        plan:
          anyOf:
            - $ref: '#/components/schemas/Plan'
            - type: 'null'
        goal_override:
          type: [string, 'null']
          description: Set by an `edit_goals` decision; replaces the plan goal for the next replan.
        decisions:
          type: array
          items:
            $ref: '#/components/schemas/LoopDecision'
          description: One entry per completed iteration, oldest first.
        q_series:
          type: array
          items:
            type: integer
            minimum: 0
            maximum: 100
          description: Quality measured at the end of each iteration.
        best_q:
          type: [number, 'null']
        best_snapshot_id:
          type: [string, 'null']
        stop_report:
          anyOf:
            - $ref: '#/components/schemas/StopReport'
            - type: 'null'
        verdict:
          anyOf:
            - $ref: '#/components/schemas/Verdict'
            - type: 'null'
        checkpoint_kind:
          anyOf:
            - $ref: '#/components/schemas/CheckpointKind'
            - type: 'null'
        on_complete:
          $ref: '#/components/schemas/OnComplete'
        user_stop_requested:
          type: boolean
          description: True while a stop is flagged but the current wave is still finishing.
        running:
          type: boolean
          description: A background task is alive for this run right now.
        tokens_spent:
          $ref: '#/components/schemas/TokenCount'
        last_error:
          type: [string, 'null']
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    RunSummary:
      type: object
      additionalProperties: false
      required: [id, project_id, kind, state, iter, running, tokens_spent, created_at, updated_at]
      properties:
        id:
          $ref: '#/components/schemas/Ulid'
        project_id:
          type: string
        kind:
          $ref: '#/components/schemas/RunKind'
        state:
          $ref: '#/components/schemas/RunStateName'
        iter:
          type: integer
          minimum: 0
        best_q:
          type: [number, 'null']
        checkpoint_kind:
          anyOf:
            - $ref: '#/components/schemas/CheckpointKind'
            - type: 'null'
        running:
          type: boolean
        tokens_spent:
          $ref: '#/components/schemas/TokenCount'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    RunList:
      type: object
      additionalProperties: false
      required: [runs, total]
      properties:
        runs:
          type: array
          items:
            $ref: '#/components/schemas/RunSummary'
        total:
          type: integer
          minimum: 0

    UserDecision:
      type: object
      description: >
        The user's answer at a checkpoint or after a stop. Which option is legal is
        published per run in `stop_report.options`; an illegal one is `409 run_conflict`.
      additionalProperties: false
      required: [option]
      properties:
        option:
          $ref: '#/components/schemas/StopOption'
        extra_tokens:
          type: [integer, 'null']
          minimum: 1
          maximum: 100000000
          description: Additional token budget for add_budget/continue.
        extra_iterations:
          type: [integer, 'null']
          minimum: 1
          maximum: 200
        new_goal:
          type: [string, 'null']
          maxLength: 800
          description: Replaces the run goal (edit_goals, or alongside continue).
        note:
          type: [string, 'null']
          maxLength: 4000
          description: >
            The information an agent asked for at a needs_input checkpoint. Handed to the
            Planner as user input; never spliced into article text by the orchestrator.
        wait:
          type: boolean
          default: false
          description: Run inline to the next pause/stop (tests, scripts).

    DigestView:
      type: object
      description: The bounded digest the Planner is fed, plus its budget.
      additionalProperties: false
      required: [run_id, markdown, tokens, max_tokens, compacted, open_issues]
      properties:
        run_id:
          $ref: '#/components/schemas/Ulid'
        markdown:
          type: string
        tokens:
          $ref: '#/components/schemas/TokenCount'
        max_tokens:
          $ref: '#/components/schemas/TokenCount'
        compacted:
          type: boolean
          description: True when the compactor rewrote the digest this iteration.
        latest_q:
          type: [integer, 'null']
          minimum: 0
          maximum: 100
        open_issues:
          type: array
          items:
            type: string

    LedgerView:
      type: object
      description: The append-only change ledger, oldest first.
      additionalProperties: false
      required: [run_id, entries]
      properties:
        run_id:
          $ref: '#/components/schemas/Ulid'
        entries:
          type: array
          items:
            $ref: '#/components/schemas/ChangeEntry'

    RunEvent:
      type: object
      description: >
        One persisted run event. The SSE stream serialises exactly this object into the
        `data:` line; `id:` repeats `seq` and `event:` repeats `type`, so a client can
        resume with `?after=<last id>`.
      additionalProperties: false
      required: [seq, ts, type, state, iter, detail]
      properties:
        seq:
          type: integer
          minimum: 0
          description: Monotonic per run, starting at 0. Used as the SSE `id:` and the resume cursor.
        ts:
          type: string
          format: date-time
        type:
          type: string
          minLength: 1
          maxLength: 64
          description: Stable snake_case event code. Clients must ignore unknown types.
        state:
          $ref: '#/components/schemas/RunStateName'
        iter:
          type: integer
          minimum: 0
        detail:
          type: object
          additionalProperties: true
          description: Event-specific payload (task id, patch id, decision reason, counts).

    RunEventList:
      type: object
      description: A page of run events - the JSON twin of the SSE stream.
      additionalProperties: false
      required: [run_id, events, next_after]
      properties:
        run_id:
          $ref: '#/components/schemas/Ulid'
        events:
          type: array
          items:
            $ref: '#/components/schemas/RunEvent'
        next_after:
          type: [integer, 'null']
          description: Pass as `after` on the next call, or null when the log is exhausted.

    QualityPoint:
      type: object
      description: One entry of the Q series.
      additionalProperties: false
      required: [iter, q, gates_passed]
      properties:
        iter:
          type: integer
          minimum: 0
        q:
          type: integer
          minimum: 0
          maximum: 100
        gates_passed:
          type: boolean
        verified_citation_ratio:
          type: number
          minimum: 0
          maximum: 1

    QualityView:
      type: object
      description: The latest quality report plus the Q history.
      additionalProperties: false
      required: [run_id, latest, series]
      properties:
        run_id:
          $ref: '#/components/schemas/Ulid'
        latest:
          anyOf:
            - $ref: '#/components/schemas/QualityReport'
            - type: 'null'
          description: Null until the first validation pass finishes.
        series:
          type: array
          items:
            $ref: '#/components/schemas/QualityPoint'
        best_q:
          type: [number, 'null']

    # ---- article ---------------------------------------------------------
    ArticleSection:
      type: object
      description: >-
        One section as the article view sends it: every SectionState field, verbatim,
        plus the exact body it describes. Flattened rather than allOf-ed because
        SectionState is additionalProperties:false, which would reject the added `text`;
        verify.mjs asserts this schema stays field-for-field equal to SectionState.
      additionalProperties: false
      required: [id, order, title, status, words, version, hash, citations, open_issues, text]
      properties:
        schema_version:
          type: integer
          const: 1
        id:
          type: string
          pattern: "^[a-z0-9][a-z0-9._-]{0,63}$"
          minLength: 1
          maxLength: 64
        title:
          type: string
          minLength: 1
          maxLength: 200
        order:
          type: integer
          minimum: 0
          maximum: 999
        status:
          type: string
          description: "SectionState.status lifecycle: empty -> draft -> reviewed -> final."
          enum: [empty, draft, reviewed, final]
        words:
          type: integer
          minimum: 0
          maximum: 200000
          default: 0
        version:
          type: integer
          description: "0 until the first patch is applied."
          minimum: 0
          default: 0
        hash:
          type: string
          description: "Hash of the exact text this state describes."
          pattern: "^sha256:[0-9a-f]{64}$"
          minLength: 1
          default: "sha256:e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"
        citations:
          type: array
          items:
            type: object
            description: "A citation site in a section.\n\n``key`` is the rendered marker (``(Smith, 2020)`` for APA7, ``[1]`` for IEEE).\n``source_id`` is None only for a marker that has no card yet - exactly the\ncondition the both-ways citation gate reports as a high-severity issue."
            additionalProperties: false
            required: [key]
            properties:
              key:
                type: string
                maxLength: 120
                minLength: 1
              source_id:
                type: [string, 'null']
                description: "None = unresolved citation site."
                default: null
        open_issues:
          type: array
          items:
            type: string
            maxLength: 40
            minLength: 2
            pattern: "^[A-Za-z][A-Za-z0-9._:-]{1,39}$"
        text:
          type: string
          description: "Markdown body of the section, exactly as assembled."

    ArticleView:
      type: object
      description: "The assembled article: markdown, section states with bodies, and every source card."
      additionalProperties: false
      required: [run_id, markdown, body_words, words_by_section, sections, sources]
      properties:
        run_id:
          $ref: '#/components/schemas/Ulid'
        markdown:
          type: string
          description: The whole article as one markdown document, sections in `order`.
        body_words:
          type: integer
          minimum: 0
          description: Body words across all sections (excludes the abstract).
        words_by_section:
          type: object
          additionalProperties:
            type: integer
            minimum: 0
        sections:
          type: array
          items:
            $ref: '#/components/schemas/ArticleSection'
        sources:
          type: array
          items:
            $ref: '#/components/schemas/SourceCard'

    VersionInfo:
      type: object
      description: Text-free metadata about one historical version of a section.
      additionalProperties: false
      required: [section_id, version, hash, words, status, chars_added, chars_removed, created_at]
      properties:
        section_id:
          $ref: '#/components/schemas/SectionId'
        version:
          $ref: '#/components/schemas/Version'
        hash:
          $ref: '#/components/schemas/Hash'
        words:
          type: integer
          minimum: 0
        status:
          type: string
          enum: [empty, draft, reviewed, final]
        chars_added:
          type: integer
          minimum: 0
        chars_removed:
          type: integer
          minimum: 0
        patch_id:
          type: [string, 'null']
        entry_id:
          type: [string, 'null']
        created_at:
          type: string
          format: date-time
        q_after:
          type: [number, 'null']
          description: Q measured while this version was the head, until somebody measures.

    SectionHistoryView:
      type: object
      additionalProperties: false
      required: [run_id, section_id, versions]
      properties:
        run_id:
          $ref: '#/components/schemas/Ulid'
        section_id:
          $ref: '#/components/schemas/SectionId'
        versions:
          type: array
          items:
            $ref: '#/components/schemas/VersionInfo'

    DiffStats:
      type: object
      description: Character-level change size, the same numbers the erosion detectors use.
      additionalProperties: false
      required: [chars_added, chars_removed, net_chars, touched_chars]
      properties:
        chars_added:
          type: integer
          minimum: 0
        chars_removed:
          type: integer
          minimum: 0
        net_chars:
          type: integer
          description: chars_added - chars_removed (negative when the text shrank).
        touched_chars:
          type: integer
          description: chars_added + chars_removed - total churn.

    TextDiff:
      type: object
      description: A rendered diff between two bodies.
      additionalProperties: false
      required: [stats, lines_added, lines_removed, unified]
      properties:
        stats:
          $ref: '#/components/schemas/DiffStats'
        lines_added:
          type: integer
          minimum: 0
        lines_removed:
          type: integer
          minimum: 0
        unified:
          type: string
          description: Unified diff text, ready to render verbatim in a monospace block.

    SectionDiffView:
      type: object
      additionalProperties: false
      required: [run_id, section_id, from, to, diff]
      properties:
        run_id:
          $ref: '#/components/schemas/Ulid'
        section_id:
          $ref: '#/components/schemas/SectionId'
        from:
          type: object
          additionalProperties: false
          required: [version, hash]
          properties:
            version:
              $ref: '#/components/schemas/Version'
            hash:
              $ref: '#/components/schemas/Hash'
            words:
              type: integer
              minimum: 0
        to:
          type: object
          additionalProperties: false
          required: [version, hash]
          properties:
            version:
              $ref: '#/components/schemas/Version'
            hash:
              $ref: '#/components/schemas/Hash'
            words:
              type: integer
              minimum: 0
        diff:
          $ref: '#/components/schemas/TextDiff'

    SnapshotSummary:
      type: object
      description: Metadata of one whole-article snapshot - no bodies.
      additionalProperties: false
      required: [id, label, created_at, section_ids, total_words]
      properties:
        id:
          type: string
          examples: [01M5Z0X96YJ8ESYMNNC8DRA8E4]
        label:
          type: string
          examples: [iter-3-q78]
        q:
          type: [number, 'null']
        iter:
          type: [integer, 'null']
        created_at:
          type: string
          format: date-time
        section_ids:
          type: array
          items:
            $ref: '#/components/schemas/SectionId'
        total_words:
          type: integer
          minimum: 0

    SnapshotList:
      type: object
      additionalProperties: false
      required: [run_id, best_snapshot_id, snapshots]
      properties:
        run_id:
          $ref: '#/components/schemas/Ulid'
        best_snapshot_id:
          type: [string, 'null']
        snapshots:
          type: array
          description: Newest first.
          items:
            $ref: '#/components/schemas/SnapshotSummary'

    RestoreRequest:
      type: object
      additionalProperties: false
      required: [snapshot_id]
      properties:
        snapshot_id:
          type: string
          minLength: 1
        dry_run:
          type: boolean
          default: false
          description: Report what would change without writing a new version.

    RestoreView:
      type: object
      description: What the restore changed. Restored sections get a new version; nothing is rewritten.
      additionalProperties: false
      required: [run_id, snapshot_id, label, restored, unchanged, versions, state, updated_at]
      properties:
        run_id:
          $ref: '#/components/schemas/Ulid'
        snapshot_id:
          type: string
        label:
          type: string
        q:
          type: [number, 'null']
        restored:
          type: array
          items:
            $ref: '#/components/schemas/SectionId'
        unchanged:
          type: array
          items:
            $ref: '#/components/schemas/SectionId'
        versions:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/Version'
        state:
          $ref: '#/components/schemas/RunStateName'
        updated_at:
          type: string
          format: date-time
        dry_run:
          type: boolean

    # ---- usage -----------------------------------------------------------
    UsageBreakdown:
      type: object
      description: >
        Tokens in one bucket. `total` is in + out (cached tokens were already counted as
        input by the provider, so they are reported, not added).
      additionalProperties: false
      required: [in, out, cached, total]
      properties:
        in:
          $ref: '#/components/schemas/TokenCount'
        out:
          $ref: '#/components/schemas/TokenCount'
        cached:
          $ref: '#/components/schemas/TokenCount'
        total:
          $ref: '#/components/schemas/TokenCount'

    RunUsageView:
      type: object
      description: Where the tokens went, against the caps they are measured against.
      additionalProperties: false
      required:
        [run_id, total, agents_total, planner, by_role, by_iter, token_cap, iterations, max_iterations]
      properties:
        run_id:
          $ref: '#/components/schemas/Ulid'
        total:
          $ref: '#/components/schemas/TokenCount'
        agents_total:
          $ref: '#/components/schemas/UsageBreakdown'
        planner:
          $ref: '#/components/schemas/UsageBreakdown'
          description: The Planner's own spend, reported apart from the agents it directs.
        by_role:
          type: object
          description: Role name -> usage. Includes the orchestrator's own repair entries.
          additionalProperties:
            $ref: '#/components/schemas/UsageBreakdown'
        by_iter:
          type: object
          description: Iteration number (as a string key) -> usage.
          additionalProperties:
            $ref: '#/components/schemas/UsageBreakdown'
        token_cap:
          $ref: '#/components/schemas/TokenCount'
          description: Policy cap plus every add_budget grant.
        iterations:
          type: integer
          minimum: 0
        max_iterations:
          type: integer
          minimum: 0
          description: Policy limit plus every extra-iteration grant.

    # ---- errors ----------------------------------------------------------
    ErrorEnvelope:
      type: object
      description: The single error shape for every expected failure.
      additionalProperties: false
      required: [error]
      properties:
        error:
          $ref: '#/components/schemas/ErrorBody'

    ErrorBody:
      type: object
      additionalProperties: false
      required: [code, message, context]
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
          description: Human-readable, already redacted. Never parse this - switch on code.
        context:
          type: object
          additionalProperties: true
          description: |
            Machine-readable detail. Which keys appear depends on the code:
            `missing_fields`/`problems`/`kind` for needs_user_input,
            `reason` for conflict/run_conflict, `errors` for validation_error,
            `run_id`/`active_run_id`/`state` where a run is involved.

    ValidationFieldError:
      type: object
      description: One rejected field. The submitted value is never included.
      additionalProperties: false
      required: [loc, msg, type]
      properties:
        loc:
          type: string
          description: Dotted location, e.g. `body.brief.target_words`.
        msg:
          type: string
          description: Why it was rejected (`Input should be a valid integer`).
        type:
          type: string
          description: Pydantic error type (`int_parsing`, `missing`, `value_error`).

    ValidationErrorEnvelope:
      type: object
      description: 422 body - the standard envelope with typed field errors.
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, context]
          properties:
            code:
              type: string
              const: validation_error
            message:
              type: string
              description: A summary of the first four errors, never echoing a value.
            context:
              type: object
              additionalProperties: false
              required: [errors]
              properties:
                errors:
                  type: array
                  items:
                    $ref: '#/components/schemas/ValidationFieldError'
                missing_fields:
                  type: array
                  description: Present when the failure is a missing field rather than a bad one.
                  items:
                    type: string

    HttpExceptionEnvelope:
      type: object
      description: >
        FastAPI's own error shape, which one route still uses (a missing agent binding).
        Kept here so the console handles it explicitly instead of crashing on an
        envelope it cannot unwrap.
      additionalProperties: false
      required: [detail]
      properties:
        detail:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              $ref: '#/components/schemas/ErrorCode'
            message:
              type: string

    ErrorCatalogEntry:
      type: object
      additionalProperties: false
      required: [code, http_status, retryable, summary, context_keys]
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        http_status:
          type: integer
          minimum: 400
          maximum: 599
        retryable:
          type: boolean
          description: True when repeating the identical call can succeed.
        summary:
          type: string
          description: One sentence for humans (the console localizes its own strings).
        context_keys:
          type: array
          items:
            type: string
          description: Keys that may appear in `context` for this code.
        subclass_of:
          type: [string, 'null']
          description: The parent code, when this one refines it (run_conflict -> conflict).

    ErrorCatalog:
      type: object
      description: The closed set of error codes for this contract version.
      additionalProperties: false
      required: [contract_version, envelope, codes]
      properties:
        contract_version:
          type: integer
          const: 1
        envelope:
          type: string
          description: A reminder of the wire shape every entry arrives in.
          examples: ['{"error": {"code", "message", "context"}}']
        codes:
          type: array
          description: Sorted by code.
          items:
            $ref: '#/components/schemas/ErrorCatalogEntry'

    # ---- accounts --------------------------------------------------------
    BudgetPatch:
      type: object
      description: >
        Monthly spend ceiling, mirroring the MonthlyBudget contract. Both null means
        unlimited; a PATCH that sends the object replaces both values.
      additionalProperties: false
      properties:
        tokens:
          type: [integer, 'null']
          minimum: 1000
          maximum: 1000000000
        usd:
          type: [number, 'null']
          exclusiveMinimum: 0
          maximum: 1000000
          description: US dollars per calendar month.

    AccountCreate:
      type: object
      description: >
        POST /api/accounts. `api_key` is write-only: accepted, encrypted, never returned -
        the view carries a fingerprint and a mask instead.
      additionalProperties: false
      required: [provider, label, api_key]
      properties:
        provider:
          $ref: '#/components/schemas/AccountProvider'
        label:
          type: string
          minLength: 1
          maxLength: 64
        api_key:
          type: string
          format: password
          minLength: 1
          maxLength: 512
          writeOnly: true
        base_url:
          type: string
          format: uri
          maxLength: 500
          description: Required for openai_compatible, rejected for every other provider.
        budget:
          $ref: '#/components/schemas/BudgetPatch'

    AccountPatch:
      type: object
      description: >
        Every field is optional: absent means unchanged, an explicit null clears
        base_url/budget/status. `api_key` may not be null - omit it to keep the key.
      additionalProperties: false
      properties:
        api_key:
          type: string
          format: password
          minLength: 1
          maxLength: 512
          writeOnly: true
        label:
          type: [string, 'null']
          maxLength: 64
        base_url:
          type: [string, 'null']
          maxLength: 500
        budget:
          anyOf:
            - $ref: '#/components/schemas/BudgetPatch'
            - type: 'null'
        status:
          anyOf:
            - $ref: '#/components/schemas/AccountStatus'
            - type: 'null'

    AccountView:
      type: object
      description: >
        What the API returns for an account. There is no field here that can return key
        material - the fingerprint identifies a key across rotations, the mask is what a
        human sees in the list.
      additionalProperties: false
      required: [id, owner_id, provider, label, status, key_fingerprint, key_mask, budget, created_at, updated_at]
      properties:
        id:
          $ref: '#/components/schemas/Ulid'
        owner_id:
          $ref: '#/components/schemas/Ulid'
        provider:
          $ref: '#/components/schemas/AccountProvider'
        label:
          type: string
        status:
          $ref: '#/components/schemas/AccountStatus'
        base_url:
          type: [string, 'null']
        key_fingerprint:
          type: string
          minLength: 12
          maxLength: 12
          description: 12 hex characters over the stored ciphertext - stable across rotations.
        key_mask:
          type: string
          description: '`****` + the last 4 characters of the key, set at write time.'
          examples: ['****c9f2']
        budget:
          $ref: '#/components/schemas/BudgetPatch'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    DeleteResult:
      type: object
      description: What a delete did, including the cascade it was allowed to perform.
      additionalProperties: false
      required: [deleted, account_id, disabled_roles, replaced_in, removed_from]
      properties:
        deleted:
          type: boolean
        account_id:
          $ref: '#/components/schemas/Ulid'
        disabled_roles:
          type: array
          description: Bindings that were disabled because no account was left for them.
          items:
            $ref: '#/components/schemas/BindingRole'
        replaced_in:
          type: array
          description: Bindings that swapped in the replacement account.
          items:
            $ref: '#/components/schemas/BindingRole'
        removed_from:
          type: array
          description: Bindings that simply dropped the account from their list.
          items:
            $ref: '#/components/schemas/BindingRole'

    AccountTestResult:
      type: object
      description: >
        Probe outcome as data. A bad credential is `ok: false` with an `error_code` -
        the probe succeeded, the credential did not - so it is not an HTTP error.
      additionalProperties: false
      required: [ok, account_id, provider, latency_ms]
      properties:
        ok:
          type: boolean
        account_id:
          $ref: '#/components/schemas/Ulid'
        provider:
          $ref: '#/components/schemas/AccountProvider'
        model:
          type: [string, 'null']
        latency_ms:
          type: integer
          minimum: 0
        error_code:
          anyOf:
            - $ref: '#/components/schemas/ErrorCode'
            - type: 'null'
        error_message:
          type: [string, 'null']

    # ---- bindings --------------------------------------------------------
    BindingPut:
      type: object
      description: >
        Create or replace one role's binding. `account_ids` is ordered: dedicated uses
        the first, failover walks the list, round_robin rotates per call.
      additionalProperties: false
      required: [account_ids, model, max_input_tokens, max_output_tokens]
      properties:
        account_ids:
          type: array
          minItems: 1
          maxItems: 16
          items:
            $ref: '#/components/schemas/Ulid'
        strategy:
          $ref: '#/components/schemas/BindingStrategy'
        model:
          type: string
          minLength: 1
          maxLength: 120
          examples: [claude-sonnet-4-6]
        max_input_tokens:
          type: integer
          minimum: 1000
          maximum: 2000000
        max_output_tokens:
          type: integer
          minimum: 64
          maximum: 64000
        enabled:
          type: boolean
          default: true

    BindingView:
      type: object
      description: The stored binding. Ids only - accounts are resolved at call time.
      additionalProperties: false
      required: [role, account_ids, strategy, model, max_input_tokens, max_output_tokens, enabled]
      properties:
        role:
          $ref: '#/components/schemas/BindingRole'
        account_ids:
          type: array
          items:
            $ref: '#/components/schemas/Ulid'
        strategy:
          $ref: '#/components/schemas/BindingStrategy'
        model:
          type: string
        max_input_tokens:
          type: integer
          minimum: 1000
          maximum: 2000000
        max_output_tokens:
          type: integer
          minimum: 64
          maximum: 64000
        enabled:
          type: boolean
        updated_at:
          type: [string, 'null']
          format: date-time

    # ---- CONTRACTS v1 (frozen; generated into docs/schemas/) -------------
    # These are $ref-ed straight from the exported JSON Schema, so the wire
    # format here and the Pydantic model in backend/app/contracts/ are the same
    # document. `make schemas --check` keeps the two in step.
    Brief:
      $ref: '../schemas/Brief.json'
    Plan:
      $ref: '../schemas/Plan.json'
    ChangeEntry:
      $ref: '../schemas/ChangeEntry.json'
    SectionState:
      $ref: '../schemas/SectionState.json'
    SourceCard:
      $ref: '../schemas/SourceCard.json'
    QualityReport:
      $ref: '../schemas/QualityReport.json'
    Verdict:
      $ref: '../schemas/Verdict.json'
    LoopDecision:
      $ref: '../schemas/LoopDecision.json'
